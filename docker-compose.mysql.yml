version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jewelry-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: "@Group666"
      MYSQL_DATABASE: moje_database
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p\"@Group666\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data: