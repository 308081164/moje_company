spring:
  application:
    name: jewelry-system

  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moje_database}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# Server Configuration
server:
  port: 8851
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Security Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours in milliseconds (access token)
  refresh-expiration: 604800000 # 7 days in milliseconds (refresh token)

# AliCloud OSS Configuration
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    max-size: 104857600 # 100MB
    allowed-extensions: .jpg,.jpeg,.png,.gif,.bmp,.pdf,.stl,.obj,.jad

# Logging Configuration
logging:
  level:
    com.jewelry: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/jewelry-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Application Configuration
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads/jewelry}
  # Default admin user
  default-admin:
    username: ${DEFAULT_ADMIN_USERNAME:kuangjun}
    password: ${DEFAULT_ADMIN_PASSWORD:}
    real-name: 系统管理员
  # Order configuration
  order:
    number-prefix: JZ
    auto-generate: true
  # Price calculation
  price:
    silver-margin: 0.035 # 3.5%
    gold-margin: 10 # 10元
    design-copyright-fee: 500 # 设计买断费用
    appraisal-certificate-fee: 300 # 鉴定证书费用
  # B2B configuration
  b2b:
    # 非空时作为完整访问链接前缀（须含 /api/b2b/order/ 与末尾 /），优先生效
    access-url-prefix: ${B2B_ACCESS_URL_PREFIX:}
    # 公网 scheme://host:port，无路径；在 access-url-prefix 为空时拼出 {base}/api/b2b/order/{token}
    public-base-url: ${JEWELRY_PUBLIC_BASE_URL:${B2B_PUBLIC_BASE_URL:http://localhost:8852}}
  # C 端客户进度页（前端 SPA 部署基址，用于拼二维码中的打开链接）
  customer-order:
    public-frontend-base-url: ${JEWELRY_CUSTOMER_ORDER_FRONTEND_URL:http://localhost:3000}
    # 与 webpack 渲染入口 HashRouter 一致：生成 /#/order-status/{token}；若静态站为 BrowserRouter 且无 #，设 false
    use-hash-routing: ${JEWELRY_CUSTOMER_ORDER_USE_HASH_ROUTING:true}
    link-ttl-days: ${JEWELRY_CUSTOMER_ORDER_LINK_TTL_DAYS:90}