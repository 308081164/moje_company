spring:
  application:
    name: jewelry-system

  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moje_database}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# Server Configuration
server:
  port: 8851
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Security Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000 # 24 hours in milliseconds (access token)
  refresh-expiration: 604800000 # 7 days in milliseconds (refresh token)

# AliCloud OSS Configuration（兼容保留，主存储已切 MinIO）
aliyun:
  oss:
    # 兼容 .env / 旧文档中的 OSS_ENDPOINT；桶名兼容 OSS_BUCKET（与 OSS_BUCKET_NAME 二选一）
    endpoint: ${ALIYUN_OSS_ENDPOINT:${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:${OSS_BUCKET:}}
    max-size: 104857600 # 100MB
    allowed-extensions: .jpg,.jpeg,.png,.gif,.bmp,.pdf,.stl,.obj,.jad

# 统一对象存储（MinIO / 本地降级，预留 CDN）——配置项已合并进下方 app 节点

# Logging Configuration
logging:
  level:
    com.jewelry: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/jewelry-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Application Configuration
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads/jewelry}
  # 统一对象存储（MinIO / 本地降级，预留 CDN）
  storage:
    mode: ${STORAGE_MODE:local}
    local-root: ${STORAGE_LOCAL_ROOT:uploads/jewelry}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:jewelry}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
  # Default admin user
  default-admin:
    username: ${DEFAULT_ADMIN_USERNAME:kuangjun}
    password: ${DEFAULT_ADMIN_PASSWORD:}
    real-name: 系统管理员
  # Order configuration
  order:
    number-prefix: JZ
    auto-generate: true
  # Price calculation
  price:
    silver-margin: 0.035 # 3.5%
    gold-margin: 10 # 10元
    design-copyright-fee: 500 # 设计买断费用
    appraisal-certificate-fee: 300 # 鉴定证书费用
  # B2B / C 端客户公开进度页：同一 Vue 门户（通常为 Nginx 8852，见 docs/8852统一客户进度门户.md）
  portal:
    base-url: ${JEWELRY_PORTAL_BASE_URL:http://localhost:8852}
  b2b:
    # 非空时作为 B2B 订单公开页「完整 URL 前缀」（须以 / 结尾），覆盖 portal.base-url + /portal/b2b/order/
    access-url-prefix: ${B2B_ACCESS_URL_PREFIX:}
  customer-order:
    # 非空时单独指定 C 端进度页 SPA 根地址（否则使用 app.portal.base-url）
    public-frontend-base-url: ${JEWELRY_CUSTOMER_ORDER_FRONTEND_URL:}
    link-ttl-days: ${JEWELRY_CUSTOMER_ORDER_LINK_TTL_DAYS:90}
  # 镶嵌结构库：对接独立项目 AI_3d_DataBase（HTTP 代理，不复用其 UI）
  inlay-db:
    api-base: ${INLAY_DB_API_BASE:http://192.168.1.10:8871/api}
    username: ${INLAY_DB_USERNAME:moje}
    password: ${INLAY_DB_PASSWORD:}
  # 国际物流：17TRACK 跟踪（未启用或查询失败时降级为「已发货（待物流更新）」）
  logistics:
    seventeen-track:
      enabled: ${SEVENTEEN_TRACK_ENABLED:false}
      api-key: ${SEVENTEEN_TRACK_API_KEY:}
      base-url: ${SEVENTEEN_TRACK_BASE_URL:https://api.17track.net/track/v2.4}