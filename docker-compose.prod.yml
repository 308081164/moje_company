# 生产环境：珠宝定制系统（MOJE）
# 目标机：62.234.174.95（OpenCloudOS），目录 /opt/moje
# 对外：API 8851，B2B 8852，C 端 8853，员工 Web / Android 壳 8854
#
# 标准 bridge 组网（不再使用旧 ECS 的 network_mode: service:mysql）。
# 主机已有宝塔 MySQL 占用 3306，故本栈 MySQL 不对宿主机暴露。

name: moje

services:
  mysql:
    image: mysql:8.4
    container_name: jewelry-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: moje_database
      TZ: Asia/Shanghai
    volumes:
      - jewelry_mysql_data:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=256M"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - jewelry-network

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/308081164/moje_company/jewelry-backend:latest}
    container_name: jewelry-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: moje_database
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-kuangjun}
      SERVER_PORT: 8851
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -XX:+UseContainerSupport}
      JEWELRY_PUBLIC_BASE_URL: ${JEWELRY_PUBLIC_BASE_URL:-http://62.234.174.95:8851}
      JEWELRY_PORTAL_BASE_URL: ${JEWELRY_PORTAL_BASE_URL:-http://62.234.174.95:8852}
      JEWELRY_CUSTOMER_ORDER_FRONTEND_URL: ${JEWELRY_CUSTOMER_ORDER_FRONTEND_URL:-http://62.234.174.95:8853}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_LOCAL_ROOT: /app/uploads
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://62.234.174.95:8851}
      YUNEXPRESS_ENV: ${YUNEXPRESS_ENV:-sandbox}
      YUNEXPRESS_APP_ID: ${YUNEXPRESS_APP_ID:-}
      YUNEXPRESS_APP_SECRET: ${YUNEXPRESS_APP_SECRET:-}
      YUNEXPRESS_SOURCE_KEY: ${YUNEXPRESS_SOURCE_KEY:-}
      YUNEXPRESS_SHIPPING_METHOD: ${YUNEXPRESS_SHIPPING_METHOD:-THPHR}
      YUNEXPRESS_SANDBOX_BASE_URL: ${YUNEXPRESS_SANDBOX_BASE_URL:-https://openapi-sbx.yunexpress.cn}
      YUNEXPRESS_PRODUCTION_BASE_URL: ${YUNEXPRESS_PRODUCTION_BASE_URL:-https://openapi.yunexpress.cn}
      YUNEXPRESS_SENDER_NAME: ${YUNEXPRESS_SENDER_NAME:-MOJE}
      YUNEXPRESS_SENDER_PHONE: ${YUNEXPRESS_SENDER_PHONE:-075512345678}
      YUNEXPRESS_SENDER_COUNTRY: ${YUNEXPRESS_SENDER_COUNTRY:-CN}
      YUNEXPRESS_SENDER_PROVINCE: ${YUNEXPRESS_SENDER_PROVINCE:-Guangdong}
      YUNEXPRESS_SENDER_CITY: ${YUNEXPRESS_SENDER_CITY:-Shenzhen}
      YUNEXPRESS_SENDER_ADDRESS: ${YUNEXPRESS_SENDER_ADDRESS:-Nanshan Science Park}
      YUNEXPRESS_SENDER_POSTAL: ${YUNEXPRESS_SENDER_POSTAL:-518000}
    ports:
      - "8851:8851"
    volumes:
      - ./logs:/app/logs
      - jewelry_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8851'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - jewelry-network

  b2b-client:
    image: ${IMAGE_B2B:-ghcr.io/308081164/moje_company/moje-b2b-client:latest}
    container_name: moje-b2b-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8852:80"
    volumes:
      - ./b2b-client/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jewelry-network

  staff-web:
    image: ${IMAGE_STAFF:-moje-staff-web:latest}
    container_name: moje-staff-web
    restart: unless-stopped
    ports:
      - "8854:80"
    networks:
      - jewelry-network

  b2c-web:
    image: ${IMAGE_B2C:-ghcr.io/308081164/moje_company/moje-b2c-web:latest}
    container_name: moje-b2c-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8853:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jewelry-network

volumes:
  jewelry_mysql_data:
  jewelry_uploads:

networks:
  jewelry-network:
    driver: bridge
