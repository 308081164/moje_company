# 生产环境：珠宝定制系统（MOJE）
# 服务器目录：/mnt/newdisk/app/MOJE
# 对外端口：API 8851，B2B 门户 8852
#
# ========== 网络说明（ECS 39.102.213.51）==========
# 部分 ECS 上 Docker 桥接容器互访失败（No route to host）。
# backend 使用 network_mode: service:mysql，通过 127.0.0.1:3306 连库；
# 对外 API 端口 8851 映射在 mysql 服务（与 backend 共享网络栈）。
# b2b-client 与 backend 共享 mysql 网络栈；8852 映射在 mysql 服务。
# 若 bridge 仍异常，请先执行 My_Servers/scripts/fix-docker-bridge.sh
#
# 典型生产命令：
#   docker compose -f docker-compose.prod.yml -p moje up -d mysql
#   docker compose -f docker-compose.prod.yml -p moje up -d --no-deps backend
#   docker compose -f docker-compose.prod.yml -p moje up -d --no-deps b2b-client

name: moje

services:
  mysql:
    image: mysql:8.4
    container_name: jewelry-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: moje_database
      TZ: Asia/Shanghai
    volumes:
      - jewelry_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "8851:8851"
      - "8852:80"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/308081164/moje_company/jewelry-backend:latest}
    container_name: jewelry-backend
    restart: unless-stopped
    network_mode: "service:mysql"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_NAME: moje_database
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-kuangjun}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-${OSS_ENDPOINT:-oss-cn-guangzhou.aliyuncs.com}}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-${OSS_BUCKET:-}}
      SERVER_PORT: 8851
      SPRING_PROFILES_ACTIVE: prod
      JEWELRY_PORTAL_BASE_URL: ${JEWELRY_PORTAL_BASE_URL:-http://localhost:8852}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8851/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  b2b-client:
    image: ${IMAGE_B2B:-ghcr.io/308081164/moje_company/moje-b2b-client:latest}
    container_name: moje-b2b-client
    restart: unless-stopped
    network_mode: "service:mysql"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./b2b-client/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


volumes:
  jewelry_mysql_data:
