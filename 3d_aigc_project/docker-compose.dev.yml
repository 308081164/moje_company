# 开发模式覆盖：Vite 热更新前端（替换 Nginx 生产构建）
# 用法（主文件已含 GPU）：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# 推荐：start.bat --dev

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    environment:
      VITE_API_PROXY_TARGET: http://business-service:8854
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8853"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8853/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
