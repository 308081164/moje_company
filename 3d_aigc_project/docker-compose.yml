# ==========================================
# Docker Compose - 开发环境
# 3D AIGC 平台服务编排
# ==========================================

version: '3.8'

services:
  # ==========================================
  # AI服务 - 3D模型生成核心服务
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: 3d-aigc-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8855}:8855"
    environment:
      - GPU_MEMORY_GB=${GPU_MEMORY_GB:-8}
      - MODEL_VERSION=${MODEL_VERSION:-auto}
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      # 模型文件目录
      - ./models:/app/models:ro
      # 镶嵌结构数据库
      - ${INLAY_DB_PATH:-./镶嵌结构数据库}:/app/inlay_db:ro
      # 输出文件目录
      - ./outputs:/app/outputs
      # 上传文件目录
      - ./uploads:/app/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - 3d-aigc-network

  # ==========================================
  # 业务服务 - API网关和任务管理
  # ==========================================
  business-service:
    build:
      context: ./business-service
      dockerfile: Dockerfile
    container_name: 3d-aigc-business-service
    ports:
      - "${BUSINESS_SERVICE_PORT:-8854}:8854"
    environment:
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8855}
      - INLAY_DB_PATH=/app/inlay_db
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - DATABASE_URL=sqlite:///./data/tasks.db
    volumes:
      # 镶嵌结构数据库（只读）
      - ${INLAY_DB_PATH:-./镶嵌结构数据库}:/app/inlay_db:ro
      # 上传和输出目录（与AI服务共享）
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # 数据持久化
      - business-data:/app/data
    depends_on:
      ai-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - 3d-aigc-network

  # ==========================================
  # 前端服务 - Vue应用
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 3d-aigc-frontend
    ports:
      - "${FRONTEND_PORT:-8853}:8853"
    depends_on:
      business-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - 3d-aigc-network

# ==========================================
# 数据卷
# ==========================================
volumes:
  business-data:
    driver: local

# ==========================================
# 网络
# ==========================================
networks:
  3d-aigc-network:
    driver: bridge
