# ==========================================
# Docker Compose - 生产环境（精简编排，无基础设施）
# 【强制 GPU】与主 compose 一致；紧急 CPU 请叠加 docker-compose.cpu.yml
# 用法：docker compose -f docker-compose.prod.yml up -d --build
# ==========================================

name: 3d-aigc-prod

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    container_name: 3d-aigc-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8855}:8855"
    environment:
      GPU_MEMORY_GB: ${GPU_MEMORY_GB:-8}
      MODEL_VERSION: ${MODEL_VERSION:-auto}
      MODEL_PATH: /app/models
      INLAY_DB_PATH: /app/inlay_db
      OUTPUT_DIR: /app/outputs
      OFFLINE_MODE: ${OFFLINE_MODE:-true}
      LOG_LEVEL: info
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      REQUIRE_GPU: ${REQUIRE_GPU:-1}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-8}
      MAX_CONCURRENT_GPU_JOBS: ${MAX_CONCURRENT_GPU_JOBS:-1}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MODELS_PATH:-./models}:/app/models:ro
      - ${INLAY_DB_PATH:-./镶嵌结构数据库}:/app/inlay_db:ro
      - ${OUTPUTS_PATH:-./outputs}:/app/outputs
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8855/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - 3d-aigc-network

  business-service:
    build:
      context: ./business-service
      dockerfile: Dockerfile
    container_name: 3d-aigc-business-service
    ports:
      - "${BUSINESS_SERVICE_PORT:-8854}:8854"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AI_SERVICE_BASE_URL: http://ai-service:8855
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseContainerSupport"
    volumes:
      - ${INLAY_DB_PATH:-./镶嵌结构数据库}:/app/inlay_db:ro
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
      - ${OUTPUTS_PATH:-./outputs}:/app/outputs
      - business-data:/app/data
      - inlay-storage:/app/inlay-storage
      - inlay-cache:/app/inlay_cache
    depends_on:
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8854/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 3d-aigc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 3d-aigc-frontend
    ports:
      - "${FRONTEND_PORT:-8853}:8853"
    depends_on:
      business-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8853/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - 3d-aigc-network

volumes:
  business-data:
    driver: local
  inlay-storage:
    driver: local
  inlay-cache:
    driver: local

networks:
  3d-aigc-network:
    driver: bridge
