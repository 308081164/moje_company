# Flutter WebView 壳：任意分支每次 push 均构建 Release APK，并上传为 Actions Artifact（同分支并发会取消旧运行）。
# main 分支构建成功时，另将 APK 发布到 GitHub Releases（固定标签 flutter-webview-shell-latest，便于固定下载入口）。
#
# WebView 加载地址按以下顺序取第一个非空值（编译进 APK）：
#   1. Variables「MOJE_WEB_APP_URL」
#   2. Secrets「MOJE_WEB_APP_URL」
#   3. Secrets「JEWELRY_WEB_APP_URL」
#   4. Secrets「JEWELRY_API_ORIGIN」（与 Electron 构建相同；若管理端与 API 不同域请用前三种之一单独配置）

name: Flutter WebView Shell (Android APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-webview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_webview_shell

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Web app URL (for APK)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          V_MOJE: ${{ vars.MOJE_WEB_APP_URL }}
          S_MOJE: ${{ secrets.MOJE_WEB_APP_URL }}
          S_JWEB: ${{ secrets.JEWELRY_WEB_APP_URL }}
          S_API: ${{ secrets.JEWELRY_API_ORIGIN }}
        run: |
          set -euo pipefail
          RES=""
          SRC=""
          if [ -n "${V_MOJE}" ]; then RES="${V_MOJE}"; SRC="vars.MOJE_WEB_APP_URL"; fi
          if [ -z "${RES}" ] && [ -n "${S_MOJE}" ]; then RES="${S_MOJE}"; SRC="secrets.MOJE_WEB_APP_URL"; fi
          if [ -z "${RES}" ] && [ -n "${S_JWEB}" ]; then RES="${S_JWEB}"; SRC="secrets.JEWELRY_WEB_APP_URL"; fi
          if [ -z "${RES}" ] && [ -n "${S_API}" ]; then
            RES="${S_API}"
            SRC="secrets.JEWELRY_API_ORIGIN"
            echo "::notice::未单独配置管理端 URL，已使用 JEWELRY_API_ORIGIN；若 APK 应打开独立前端地址，请设置 MOJE_WEB_APP_URL。"
          fi
          if [ -z "${RES}" ]; then
            echo "::error::请配置其一：Variables「MOJE_WEB_APP_URL」、Secrets「MOJE_WEB_APP_URL」或「JEWELRY_WEB_APP_URL」；或已配置 Secrets「JEWELRY_API_ORIGIN」且与加载地址一致。"
            exit 1
          fi
          # 若误带末尾 /api，去掉（JEWELRY_API_ORIGIN 约定为不含 /api，此处仅容错）
          case "${RES}" in
            */api) RES="${RES%/api}" ;;
            */api/) RES="${RES%/api/}" ;;
          esac
          RES="${RES%/}"
          echo "Resolved WEB_APP_URL from: ${SRC}"
          printf '%s' "${RES}" > "${RUNNER_TEMP}/moje_web_app_url.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project & resolve dependencies
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          # 仓库仅保留 lib/pubspec 时，在 CI 内补齐 android/
          flutter create . \
            --org com.moje \
            --project-name moje_webview_shell \
            --platforms=android

      - name: Build release APK
        run: |
          set -euo pipefail
          MOJE_WEB_APP_URL="$(cat "${RUNNER_TEMP}/moje_web_app_url.txt")"
          flutter build apk --release \
            --dart-define=WEB_APP_URL="${MOJE_WEB_APP_URL}"

      - name: Stage APK with readable name
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SRC"
          OUT="moje-webview-shell-${GITHUB_SHA:0:7}.apk"
          cp "$SRC" "${GITHUB_WORKSPACE}/${OUT}"
          echo "path=${GITHUB_WORKSPACE}/${OUT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: moje-webview-shell-apk-${{ github.run_id }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Stage APK for GitHub Release (fixed filename)
        if: github.ref == 'refs/heads/main'
        id: release_apk
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ steps.apk.outputs.path }}"
          DEST="${GITHUB_WORKSPACE}/moje-webview-shell.apk"
          cp -f "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Remove previous rolling APK asset (if any)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="flutter-webview-shell-latest"
          NAME="moje-webview-shell.apk"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete-asset "${TAG}" "${NAME}" --repo "${{ github.repository }}" --yes || true
          fi

      - name: Publish APK to GitHub Releases (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-webview-shell-latest
          name: Flutter WebView Shell（Android APK）
          body: |
            自动构建的 WebView 壳 **Release APK**（加载地址由构建时的 Variables / Secrets 解析，见工作流说明）。

            - 提交：`${{ github.sha }}`
            - 工作流：[${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 同次构建的 Artifact：`moje-webview-shell-apk-${{ github.run_id }}`（带短 SHA 文件名）

            非 main 分支仅保留 Actions Artifact，不更新本 Release。
          draft: false
          prerelease: false
          make_latest: false
          files: ${{ steps.release_apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
