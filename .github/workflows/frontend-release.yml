name: Build and Release Frontend

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  detect-frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-release.yml'

  build-and-release:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build windows release files
        env:
          # 在仓库 Settings → Secrets 中配置，值为后端基址（不含 /api），例如 http://your-server:8851
          JEWELRY_API_ORIGIN: ${{ secrets.JEWELRY_API_ORIGIN }}
        run: npm run package:win

      - name: Upload release artifacts for OSS
        uses: actions/upload-artifact@v4
        with:
          name: frontend-win-release
          path: |
            frontend/release/latest.yml
            frontend/release/*.exe
            frontend/release/*.blockmap
          if-no-files-found: error

  upload-to-oss:
    needs: [detect-frontend-changes, build-and-release]
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-release
          path: ./release

      - name: Install ossutil
        run: |
          set -euo pipefail
          # 官方 Release 仅提供 zip（如 ossutil-v1.7.18-linux-amd64.zip），不存在旧的 ossutil64-linux.tar.gz；
          # 若下载失败仍 exit 0，下一步会报 127，因此此处必须成功或显式失败。
          VER="1.7.18"
          case "$(uname -m)" in
            x86_64) SUFFIX="amd64" ;;
            aarch64) SUFFIX="arm64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          URL="https://github.com/aliyun/ossutil/releases/download/v${VER}/ossutil-v${VER}-linux-${SUFFIX}.zip"
          curl -fSL -o "${RUNNER_TEMP}/ossutil.zip" "${URL}"
          mkdir -p "${RUNNER_TEMP}/ossutil-extract"
          unzip -q -o "${RUNNER_TEMP}/ossutil.zip" -d "${RUNNER_TEMP}/ossutil-extract"
          BIN="$(find "${RUNNER_TEMP}/ossutil-extract" -maxdepth 4 -name ossutil64 -type f | head -n 1)"
          if [ -z "${BIN}" ] || [ ! -f "${BIN}" ]; then
            echo "Could not locate ossutil64 inside release archive"
            find "${RUNNER_TEMP}/ossutil-extract" -type f || true
            exit 1
          fi
          install -m 0755 "${BIN}" "${GITHUB_WORKSPACE}/ossutil64"
          "${GITHUB_WORKSPACE}/ossutil64" --version

      - name: Upload update files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_UPDATE_PREFIX: ${{ secrets.OSS_UPDATE_PREFIX }}
        run: |
          set -euo pipefail
          
          if [ -z "${OSS_ACCESS_KEY_ID}" ] || [ -z "${OSS_ACCESS_KEY_SECRET}" ] || [ -z "${OSS_ENDPOINT}" ] || [ -z "${OSS_BUCKET}" ] || [ -z "${OSS_UPDATE_PREFIX}" ]; then
            echo "Warning: OSS secrets not fully configured, skipping OSS upload"
            ls -la ./release/
            exit 0
          fi

          OSSUTIL="${GITHUB_WORKSPACE}/ossutil64"
          if [ ! -x "${OSSUTIL}" ]; then
            echo "ossutil not installed at ${OSSUTIL}"
            exit 1
          fi

          TARGET_PREFIX="${OSS_UPDATE_PREFIX#/}"
          TARGET_PREFIX="${TARGET_PREFIX%/}"

          "${OSSUTIL}" config -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" -L CH
          "${OSSUTIL}" cp -rf ./release/ "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"
          "${OSSUTIL}" ls "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"

  create-github-release:
    needs: [detect-frontend-changes, build-and-release]
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-release
          path: ./release

      - name: Generate version tag
        id: generate_tag
        run: |
          TAG_VERSION="v$(date +'%Y.%m.%d.%H%M%S')"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Creating release with tag: $TAG_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_version }}
          name: Release ${{ steps.generate_tag.outputs.tag_version }}
          body: |
            自动构建发布 - ${{ steps.generate_tag.outputs.tag_version }}
            
            **更新内容:**
            - 自动构建的 Electron 桌面应用
            - 支持自动更新

          draft: false
          prerelease: false
          files: |
            ./release/*.exe
            ./release/*.yml
            ./release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skip-log:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No frontend changes
        run: echo "No frontend changes detected. Skip build and release."
