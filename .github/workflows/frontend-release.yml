name: Build and Release Frontend

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  detect-frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-release.yml'

  build-and-release:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build windows release files
        run: npm run package:win

      - name: Upload release artifacts for OSS
        uses: actions/upload-artifact@v4
        with:
          name: frontend-win-release
          path: |
            frontend/release/latest.yml
            frontend/release/*.exe
            frontend/release/*.blockmap
          if-no-files-found: error

  upload-to-oss:
    needs: [detect-frontend-changes, build-and-release]
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-release
          path: ./release

      - name: Install ossutil
        run: |
          set -e
          curl -L -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64-linux.zip
          unzip -q ossutil.zip
          chmod +x ossutil64

      - name: Upload update files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_UPDATE_PREFIX: ${{ secrets.OSS_UPDATE_PREFIX }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?missing OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?missing OSS_ACCESS_KEY_SECRET}"
          : "${OSS_ENDPOINT:?missing OSS_ENDPOINT}"
          : "${OSS_BUCKET:?missing OSS_BUCKET}"
          : "${OSS_UPDATE_PREFIX:?missing OSS_UPDATE_PREFIX}"

          TARGET_PREFIX="${OSS_UPDATE_PREFIX#/}"
          TARGET_PREFIX="${TARGET_PREFIX%/}"

          ./ossutil64 config -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" -L CH
          ./ossutil64 cp -rf ./release/ "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"
          ./ossutil64 ls "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"

  skip-log:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No frontend changes
        run: echo "No frontend changes detected. Skip build and release."
