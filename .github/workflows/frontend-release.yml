name: Build and Release Frontend

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  detect-frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-release.yml'

  build-and-release:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build windows release files
        run: npm run package:win

      - name: Upload release artifacts for OSS
        uses: actions/upload-artifact@v4
        with:
          name: frontend-win-release
          path: |
            frontend/release/latest.yml
            frontend/release/*.exe
            frontend/release/*.blockmap
          if-no-files-found: error

  upload-to-oss:
    needs: [detect-frontend-changes, build-and-release]
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-release
          path: ./release

      - name: Install ossutil
        run: |
          set -e
          curl -L -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64-linux.zip
          unzip -q ossutil.zip
          chmod +x ossutil64

      - name: Upload update files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_UPDATE_PREFIX: ${{ secrets.OSS_UPDATE_PREFIX }}
        run: |
          set -euo pipefail
          
          if [ -z "${OSS_ACCESS_KEY_ID}" ] || [ -z "${OSS_ACCESS_KEY_SECRET}" ] || [ -z "${OSS_ENDPOINT}" ] || [ -z "${OSS_BUCKET}" ] || [ -z "${OSS_UPDATE_PREFIX}" ]; then
            echo "Warning: OSS secrets not fully configured, skipping OSS upload"
            ls -la ./release/
            exit 0
          fi

          TARGET_PREFIX="${OSS_UPDATE_PREFIX#/}"
          TARGET_PREFIX="${TARGET_PREFIX%/}"

          ./ossutil64 config -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" -L CH
          ./ossutil64 cp -rf ./release/ "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"
          ./ossutil64 ls "oss://${OSS_BUCKET}/${TARGET_PREFIX}/"

  create-github-release:
    needs: [detect-frontend-changes, build-and-release]
    if: needs.detect-frontend-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-win-release
          path: ./release

      - name: Generate version tag
        id: generate_tag
        run: |
          TAG_VERSION="v$(date +'%Y.%m.%d.%H%M%S')"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Creating release with tag: $TAG_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_version }}
          name: Release ${{ steps.generate_tag.outputs.tag_version }}
          body: |
            自动构建发布 - ${{ steps.generate_tag.outputs.tag_version }}
            
            **更新内容:**
            - 自动构建的 Electron 桌面应用
            - 支持自动更新

          draft: false
          prerelease: false
          files: |
            ./release/*.exe
            ./release/*.yml
            ./release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skip-log:
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No frontend changes
        run: echo "No frontend changes detected. Skip build and release."
