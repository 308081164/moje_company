name: Build and Deploy Jewelry System

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/jewelry-backend
  B2B_IMAGE_NAME: ${{ github.repository }}/moje-b2b-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn -f backend/pom.xml clean package -DskipTests -s backend/settings.xml
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    
    - name: Build and push B2B client image
      uses: docker/build-push-action@v4
      with:
        context: ./b2b-client
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.B2B_IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.B2B_IMAGE_NAME }}:${{ github.sha }}
    
    - name: Run tests
      run: mvn -f backend/pom.xml test
  
  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 与下方 ssh-action command_timeout 对齐，避免整 job 先于远程脚本结束
    timeout-minutes: 150
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3

    - name: Validate SSH secrets
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USERNAME }}" ]; then
          echo "Missing required secrets: SSH_HOST / SSH_USERNAME"
          exit 1
        fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
          echo "Missing SSH credential: set either SSH_PASSWORD or SSH_PRIVATE_KEY (recommended)."
          exit 1
        fi
    
    - name: Deploy to production server
      uses: appleboy/ssh-action@v0.1.5
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        DOCKER_COMPOSE_CONFIG: |
          version: "3.9"

          services:
            mysql:
              image: mysql:8.4
              container_name: jewelry-mysql
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
                MYSQL_DATABASE: moje_database
                TZ: Asia/Shanghai
              volumes:
                - jewelry_mysql_data:/var/lib/mysql
              command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
              networks:
                - jewelry-network
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
                interval: 10s
                timeout: 5s
                retries: 30
                start_period: 60s

            backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              container_name: jewelry-backend
              depends_on:
                mysql:
                  condition: service_healthy
              environment:
                DB_HOST: mysql
                DB_PORT: 3306
                DB_NAME: moje_database
                DB_USER: root
                DB_PASSWORD: ${DB_PASSWORD}
                OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
                OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
                OSS_ENDPOINT: oss-cn-guangzhou.aliyuncs.com
                OSS_BUCKET: moje-jewelry-files
                SERVER_PORT: 8851
                SPRING_PROFILES_ACTIVE: prod
              ports:
                - "8851:8851"
              volumes:
                - ./logs:/app/logs
              restart: unless-stopped
              networks:
                - jewelry-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8851/api/actuator/health"]
                interval: 30s
                timeout: 10s
                retries: 3

            b2b-client:
              image: ${{ env.REGISTRY }}/${{ env.B2B_IMAGE_NAME }}:latest
              container_name: moje-b2b-client
              depends_on:
                backend:
                  condition: service_healthy
              ports:
                - "8080:80"
              restart: unless-stopped
              networks:
                - jewelry-network
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 10s

          networks:
            jewelry-network:
              driver: bridge

          volumes:
            jewelry_mysql_data:
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT || 22 }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        # 默认 10m，远程 docker pull 大镜像易超时，放宽至 2 小时
        command_timeout: 2h
        envs: DOCKER_COMPOSE_CONFIG,DB_PASSWORD,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET
        script: |
          set -euo pipefail
          : "${DOCKER_COMPOSE_CONFIG:?DOCKER_COMPOSE_CONFIG is empty (workflow env not forwarded)}"
          : "${DB_PASSWORD:?DB_PASSWORD is empty (missing GitHub secret DB_PASSWORD)}"

          # 让 docker compose 能读取到用于变量替换的环境变量（${DB_PASSWORD} 等）
          export DB_PASSWORD OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET
          # ========== 1. 准备环境 ==========
          echo "=== 开始部署珠宝定制系统 ==="
          
          # 检查现有服务目录结构
          echo "检查现有服务目录..."
          ls -la /opt/
          
          # 部署到指定磁盘目录（避免系统盘空间/权限问题）
          JEWELRY_DIR="/mnt/newdisk/app/MOJE"
          APP_DIR="$JEWELRY_DIR"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          
          # 宿主机持久化目录
          mkdir -p ./logs
          
          # ========== 2. 创建docker-compose配置 ==========
          echo "创建docker-compose.prod.yml..."
          cat > docker-compose.prod.yml << DOCKER_EOF
          ${DOCKER_COMPOSE_CONFIG}
          DOCKER_EOF

          echo "校验 docker compose 配置..."
          docker compose -f docker-compose.prod.yml config >/dev/null
          
          # ========== 3. 设置环境变量 ==========
          echo "设置环境变量..."
          export IMAGE_BACKEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # ========== 4. 修复 Flyway 状态 ==========
          echo "检查 Flyway 状态..."
          # 先启动 MySQL 来修复数据库状态
          docker compose -f docker-compose.prod.yml up -d mysql
          sleep 30
          
          # 删除失败的 V5 迁移记录（如果存在）
          echo "清理 Flyway 失败状态..."
          docker exec jewelry-mysql mysql -uroot -p${DB_PASSWORD} moje_database -e "DELETE FROM flyway_schema_history WHERE version = '5' AND success = 0;" || true
          
          # 停止临时的 MySQL，让完整部署接管
          docker compose -f docker-compose.prod.yml down
          sleep 5
          
          # ========== 5. 部署服务 ==========
          echo "拉取最新镜像..."
          docker compose -f docker-compose.prod.yml pull
          
          echo "启动服务..."
          docker compose -f docker-compose.prod.yml up -d --force-recreate || {
            echo "docker compose up 失败，输出诊断信息..."
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- jewelry-mysql logs ---"
            docker logs jewelry-mysql --tail 200 || true
            echo "--- jewelry-backend logs ---"
            docker logs jewelry-backend --tail 1200 || true
            echo "--- jewelry-mysql health ---"
            docker inspect -f '{{json .State.Health}}' jewelry-mysql 2>/dev/null || true
            exit 1
          }
          
          # ========== 6. 验证部署 ==========
          echo "等待服务启动..."
          # 给 JVM / Flyway / JPA 更多启动时间
          sleep 25
          
          echo "检查容器状态..."
          docker ps --filter "name=jewelry" --filter "name=moje" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          # ========== 6.1 验证 B2B 前端部署 ==========
          echo "验证 B2B 前端服务..."
          b2b_ok=0
          for i in $(seq 1 12); do
            if curl -fsS "http://localhost:8080/" >/dev/null 2>&1; then
              b2b_ok=1
              echo "✅ B2B 前端服务健康检查通过"
              break
            fi
            echo "B2B 前端健康检查未通过，重试 ${i}/12 ..."
            sleep 5
          done
          
          if [ "$b2b_ok" != "1" ]; then
            echo "️  B2B 前端服务健康检查失败，输出诊断信息..."
            echo "--- curl http://localhost:8080/ ---"
            curl -i "http://localhost:8080/" || true
            echo "--- moje-b2b-client logs ---"
            docker logs moje-b2b-client --tail 200 || true
            echo "--- docker ps (b2b) ---"
            docker ps --filter "name=moje-b2b" --format "table {{.Names}}\t{{.Status}}" || true
          fi
          
          # ========== 6.2 验证后端服务健康 ==========
          echo "检查后端服务健康..."
          ok=0
          for i in $(seq 1 24); do
            if curl -fsS "http://localhost:8851/api/actuator/health" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "健康检查未通过，重试 ${i}/24 ..."
            sleep 5
          done
          
          if [ "$ok" = "1" ]; then
            echo "✅ 服务健康检查通过"
          else
            echo "⚠️  服务健康检查最终失败，输出诊断信息..."
            echo "--- curl /api/actuator/health ---"
            curl -i "http://localhost:8851/api/actuator/health" || true
            echo "--- curl /actuator/health (排除 context-path 影响) ---"
            curl -i "http://localhost:8851/actuator/health" || true
            echo "--- docker ps ---"
            docker ps --filter "name=jewelry" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- jewelry-backend logs ---"
            docker logs jewelry-backend --tail 2000 || true
            exit 1
          fi
          
          # ========== 7. 清理 ==========
          echo "清理未使用的镜像..."
          docker image prune -f
          
          echo "=== 部署完成 ==="
          echo "后端地址: http://${{ secrets.SSH_HOST }}:8851"
          echo "后端健康检查: http://${{ secrets.SSH_HOST }}:8851/actuator/health"
          echo "B2B 前端门户: http://${{ secrets.SSH_HOST }}"
          echo "B2B 前端健康检查: http://${{ secrets.SSH_HOST }}"
          echo ""
          echo "提示: 如需启用 HTTPS，请配置 SSL 证书并重新部署"