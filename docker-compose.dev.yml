# 本地联调：请在仓库根目录复制 .env.example 为 .env 并填写密钥后再启动。
# 示例：docker compose --env-file .env -f docker-compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: jewelry-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: moje_database
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - jewelry-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelry-backend-dev
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=moje_database
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?}
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT:-oss-cn-guangzhou.aliyuncs.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?请在 .env 中设置 DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-kuangjun}
      - JEWELRY_PUBLIC_BASE_URL=${JEWELRY_PUBLIC_BASE_URL:-http://localhost:8851}
      - JEWELRY_PORTAL_BASE_URL=${JEWELRY_PORTAL_BASE_URL:-http://localhost:8852}
    ports:
      - "8851:8851"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - jewelry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8851/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  b2b-client:
    build:
      context: ./b2b-client
      dockerfile: Dockerfile
    container_name: moje-b2b-client
    ports:
      - "8852:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jewelry-network
    restart: unless-stopped

  # 珠宝定制管理系统前端（Web 开发模式）
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: moje-frontend-admin
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8851/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jewelry-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  jewelry-network:
    driver: bridge
