<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>duxury &middot; Shop</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261031hero1">
</head>
<body class="storefront-page mall-page">

<header class="header scrolled" id="header">
  <div class="header__inner">
    <a href="index.html" class="brand"><span class="brand__name">duxury</span></a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link" data-i18n="nav.home">Home</a>
      <a href="shop.html" class="nav__link nav__link--active" data-i18n="nav.shop">Shop</a>
      <a href="order-workspace.html" class="nav__link" data-i18n="nav.orders">Orders</a>
      <a href="seller.html" class="nav__link" data-i18n="nav.studio">Studio</a>
    </nav>
    <div class="header__actions">
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" id="langBtn" aria-label="Language" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-lang-current>EN</span>
          <svg class="lang__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang__menu" id="langMenu"></div>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="mall">
  <div class="container mall__body">
    <nav class="mall-crumb" aria-label="Breadcrumb">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <span class="mall-crumb__sep">/</span>
      <span data-i18n="nav.shop">Shop</span>
    </nav>

    <div class="mall-search" id="mallSearchBar">
      <label class="mall-search__box" id="shopSearchBox">
        <input type="search" id="shopSearch" data-i18n-placeholder="shop.search.ph" placeholder="Search title, maker or type…">
        <button type="button" class="mall-search__btn" id="shopSearchBtn" data-i18n="shop.search.btn">Search</button>
      </label>
    </div>

    <div class="mall-banner">
      <div class="mall-banner__text">
        <p class="mall-banner__tag" data-i18n="shopcta.eyebrow">BESPOKE SERVICE</p>
        <p class="mall-banner__title" data-i18n="shopcta.title">Want a one-of-a-kind design made just for you?</p>
        <p class="mall-banner__desc" data-i18n="shopcta.desc">Our designers craft it for you — one-on-one, from inspiration to finished piece.</p>
      </div>
      <a class="mall-banner__btn" href="index.html#services"><span data-i18n="shopcta.btn">Start Custom</span></a>
    </div>

    <div class="mall-cats" id="shopTypeFilter" role="tablist" aria-label="Jewelry type filter"></div>

    <div class="mall-toolbar">
      <div class="mall-sort" id="shopSort" role="group" aria-label="Sort"></div>
      <div class="mall-count" id="shopCount"></div>
    </div>

    <div class="shop-grid" id="shopGrid"></div>
  </div>
</section>

<footer class="footer mall-footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <span class="brand__name">duxury</span>
    </div>
  </div>
</footer>

<script src="js/i18n.js?v=20261102en"></script>
<script src="js/jewelryType.js?v=20261020b"></script>
<script src="js/api.js?v=20261026d"></script>
<script src="js/main.js?v=20261028mall"></script>
<script src="js/storefront.js?v=20261031hero1"></script>
</body>
</html>
