<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duxury &middot; Seller studio</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261019j">
  <style>
    /* 「我的上架」卡片与编辑弹窗（scoped，仅本页使用） */
    .sl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; margin-bottom: 32px; }
    .sl-card { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
    .sl-card__img { position: relative; aspect-ratio: 1; background: #efe8dc; }
    .sl-card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sl-card__ph { width: 100%; height: 100%; background: linear-gradient(135deg, #efe8dc, #e2d7c3); }
    .sl-badge { position: absolute; top: 10px; left: 10px; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; letter-spacing: 0.04em; }
    .sl-badge--live { background: rgba(46, 125, 78, 0.92); color: #fff; }
    .sl-badge--paused { background: rgba(90, 88, 84, 0.88); color: #fff; }
    .sl-card__body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .sl-card__title { font-family: var(--font-serif); font-size: 1.05rem; margin: 0; line-height: 1.35; }
    .sl-card__row { display: flex; justify-content: space-between; align-items: baseline; }
    .sl-card__price { color: var(--gold-dark); font-weight: 600; }
    .sl-card__meta { font-size: 0.8rem; color: var(--text-muted); }
    .sl-card__actions { display: flex; gap: 8px; margin-top: auto; }
    .sl-btn { padding: 7px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border-light); background: #fff; color: inherit; }
    .sl-btn:hover { border-color: var(--gold); }
    .sl-btn--gold { background: var(--gold); border-color: var(--gold); color: #1a1814; }
    .sl-btn--warn { background: transparent; color: #e05d5d; border: 1px solid #e05d5d; }
    .sl-modal { position: fixed; inset: 0; display: none; z-index: 120; }
    .sl-modal.open { display: block; }
    .sl-modal__backdrop { position: absolute; inset: 0; background: rgba(20, 18, 14, 0.55); }
    .sl-modal__dialog { position: relative; margin: 6vh auto; max-width: 720px; width: calc(100% - 32px); background: #fff; border-radius: var(--radius-lg); padding: 26px 28px; max-height: 88vh; overflow-y: auto; }
    .sl-modal__close { position: absolute; top: 14px; right: 16px; border: none; background: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted-dark); }
    .sl-modal__title { font-family: var(--font-serif); margin: 0 0 16px; font-size: 1.4rem; }
    .sl-edit { display: grid; grid-template-columns: 1fr 220px; gap: 20px; }
    .sl-label { display: block; font-size: 0.8rem; color: var(--text-muted-dark); margin: 10px 0 4px; }
    .sl-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-light); border-radius: 8px; font: inherit; background: #fff; box-sizing: border-box; }
    .sl-input:focus { outline: none; border-color: var(--gold); }
    .sl-edit__preview { aspect-ratio: 1; background: #efe8dc; border-radius: 8px; overflow: hidden; }
    .sl-edit__preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sl-modal__actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    @media (max-width: 640px) { .sl-edit { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="storefront-page">

<header class="header scrolled" id="header">
  <div class="header__inner">
    <a href="index.html" class="brand"><span class="brand__name">duxury</span></a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link" data-i18n="nav.home">Home</a>
      <a href="works.html" class="nav__link" data-i18n="nav.portfolio">Portfolio</a>
      <a href="shop.html" class="nav__link" data-i18n="nav.shop">Shop</a>
      <a href="order-workspace.html" class="nav__link" data-i18n="nav.orders">Orders</a>
      <a href="seller.html" class="nav__link nav__link--active" data-i18n="nav.studio">Studio</a>
    </nav>
    <div class="header__actions">
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" id="langBtn" aria-label="Language" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-lang-current>EN</span>
          <svg class="lang__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang__menu" id="langMenu"></div>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="order-gate" id="sellerGate" style="display:none">
  <div class="order-gate__content">
    <h2 class="order-gate__title" data-i18n="studio.gate">Sign in to manage your shop</h2>
    <button class="btn btn--gold btn--lg" id="sellerGateLogin" data-i18n="gate.cta">Sign in</button>
  </div>
</div>

<section class="section seller-page" id="sellerRoot" style="display:none">
  <div class="container" id="sellerBody"></div>
</section>

<div class="modal" id="loginModal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
    <div class="modal__brand">duxury</div>
    <h3 class="modal__title" data-i18n="login.title">Sign in to continue</h3>
    <p class="modal__sub" data-i18n="studio.gate">Sign in to manage your shop</p>
    <button class="login-google" id="googleLogin">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Continue with Google</span>
    </button>
    <div class="modal__divider"><span data-i18n="login.or">or</span></div>
    <div class="login-email">
      <input type="email" id="emailInput" placeholder="you@example.com" data-i18n-placeholder="login.email.ph">
      <button class="btn btn--gold" id="emailContinue" data-i18n="login.continue">Continue</button>
    </div>
    <div class="login-email" id="emailCodeStep" style="display:none">
      <input type="text" id="codeInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Verification code" data-i18n-placeholder="login.code.ph">
      <button class="btn btn--gold" id="codeConfirm" data-i18n="login.verify">Verify</button>
    </div>
    <p class="login-email__hint" id="emailCodeHint" style="display:none"></p>
  </div>
</div>

<div class="sl-modal" id="listingEditModal" aria-hidden="true">
  <div class="sl-modal__backdrop" data-sl-close></div>
  <div class="sl-modal__dialog">
    <button class="sl-modal__close" data-sl-close aria-label="Close">&times;</button>
    <h3 class="sl-modal__title" data-i18n="studio.edit.title">Edit listing</h3>
    <div class="sl-edit">
      <div class="sl-edit__form">
        <label class="sl-label" for="slEditTitle" data-i18n="studio.field.title">Title</label>
        <input class="sl-input" id="slEditTitle" maxlength="200">
        <label class="sl-label" for="slEditDesc" data-i18n="studio.field.desc">Description</label>
        <textarea class="sl-input" id="slEditDesc" rows="4"></textarea>
        <label class="sl-label" for="slEditPrice" data-i18n="studio.field.price">Sale price (USD)</label>
        <input class="sl-input" id="slEditPrice" type="number" min="0.01" step="0.01">
        <label class="sl-label" for="slEditCover" data-i18n="studio.field.cover">Cover image URL</label>
        <input class="sl-input" id="slEditCover" placeholder="https://…">
      </div>
      <div class="sl-edit__side">
        <span class="sl-label" data-i18n="studio.preview">Preview</span>
        <div class="sl-edit__preview"><img id="slEditPreview" alt="" style="display:none"></div>
      </div>
    </div>
    <div class="sl-modal__actions">
      <button class="sl-btn" data-sl-close data-i18n="studio.cancel">Cancel</button>
      <button class="sl-btn sl-btn--gold" id="slEditSave" data-i18n="studio.save">Save</button>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=20261019j"></script>
<script src="js/api.js?v=20261019j"></script>
<script src="js/main.js?v=20261019j"></script>
<script src="js/storefront.js?v=20261019j"></script>
</body>
</html>
