<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261022f">
</head>
<body class="storefront-page">

<header class="header scrolled" id="header">
  <div class="header__inner">
    <a href="index.html" class="brand"><span class="brand__name">duxury</span></a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link" data-i18n="nav.home">Home</a>
      <a href="works.html" class="nav__link" data-i18n="nav.portfolio">Portfolio</a>
      <a href="shop.html" class="nav__link nav__link--active" data-i18n="nav.shop">Shop</a>
      <a href="order-workspace.html" class="nav__link" data-i18n="nav.orders">Orders</a>
      <a href="seller.html" class="nav__link" data-i18n="nav.studio">Studio</a>
    </nav>
    <div class="header__actions">
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" id="langBtn" aria-label="Language" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-lang-current>EN</span>
          <svg class="lang__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang__menu" id="langMenu"></div>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="section listing-page">
  <div class="container listing-layout" id="listingRoot"></div>
</section>

<div class="modal" id="loginModal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
    <div class="modal__brand">duxury</div>
    <h3 class="modal__title" data-i18n="login.title">Sign in to continue</h3>
    <p class="modal__sub" data-i18n="login.sub">Sign in is required to view your orders</p>
    <button class="login-google" id="googleLogin">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Continue with Google</span>
    </button>
    <div class="modal__divider"><span data-i18n="login.or">or</span></div>
    <div class="login-email">
      <input type="email" id="emailInput" placeholder="you@example.com" data-i18n-placeholder="login.email.ph">
      <button class="btn btn--gold" id="emailContinue" data-i18n="login.continue">Continue</button>
    </div>
    <div class="login-email" id="emailCodeStep" style="display:none">
      <input type="text" id="codeInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Verification code" data-i18n-placeholder="login.code.ph">
      <button class="btn btn--gold" id="codeConfirm" data-i18n="login.verify">Verify</button>
    </div>
    <p class="login-email__hint" id="emailCodeHint" style="display:none"></p>
  </div>
</div>

<script src="js/i18n.js?v=20261020c"></script>
<script src="js/jewelryType.js?v=20261020b"></script>

<script src="js/api.js?v=20261020b"></script>
<script src="js/main.js?v=20261022f"></script>
<script src="js/storefront.js?v=20261020c"></script>
</body>
</html>
