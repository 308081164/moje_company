<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duxury &middot; Refer &amp; Earn</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261027b">
  <style>
    /* 个人推广页（scoped） */
    .pm-share { display: grid; grid-template-columns: 300px 1fr; gap: 24px; margin: 24px 0 32px; }
    .pm-qr { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 18px; text-align: center; }
    .pm-qr img { width: 100%; aspect-ratio: 1; display: block; }
    .pm-qr__tip { margin-top: 10px; font-size: 0.78rem; color: var(--text-muted-dark); }
    .pm-card { background: linear-gradient(150deg, #191510, #2b2318 60%, #1c1811); color: #f3e9d2; border-radius: var(--radius-lg); padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; }
    .pm-card__brand { font-family: var(--font-serif); font-size: 1rem; letter-spacing: 0.35em; text-transform: uppercase; color: #c9a85c; }
    .pm-card__label { font-size: 0.8rem; color: rgba(243, 233, 210, 0.72); }
    .pm-card__code { font-family: var(--font-serif); font-size: 2.6rem; letter-spacing: 0.28em; color: #e9cf8f; line-height: 1.1; }
    .pm-card__rate { font-size: 0.9rem; color: #f3e9d2; }
    .pm-card__row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .pm-btn { padding: 9px 18px; border-radius: 8px; font-size: 0.84rem; cursor: pointer; border: 1px solid rgba(201, 168, 92, 0.65); background: transparent; color: #e9cf8f; }
    .pm-btn:hover { background: rgba(201, 168, 92, 0.16); }
    .pm-btn--gold { background: #c9a85c; border-color: #c9a85c; color: #1a1814; font-weight: 600; }
    .pm-btn--gold:hover { background: #dabb77; }
    .pm-link { word-break: break-all; font-size: 0.8rem; color: rgba(243, 233, 210, 0.6); }
    .pm-poster { margin: 0 0 32px; }
    .pm-poster__frame { max-width: 360px; border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; background: #14110d; }
    .pm-poster__frame canvas { width: 100%; display: block; }
    .pm-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
    .pm-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; letter-spacing: 0.04em; }
    .pm-badge--pending { background: rgba(217, 119, 6, 0.14); color: #b45309; }
    .pm-badge--settled { background: rgba(46, 125, 78, 0.14); color: #2e7d4e; }
    .pm-badge--cancelled { background: rgba(107, 114, 128, 0.16); color: #6b7280; }
    .pm-amount--in { color: #2e7d4e; font-weight: 600; }
    .pm-amount--out { color: #b45309; font-weight: 600; }
    @media (max-width: 760px) { .pm-share, .pm-stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="storefront-page">

<header class="header scrolled" id="header">
  <div class="header__inner">
    <a href="index.html" class="brand"><span class="brand__name">duxury</span></a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link" data-i18n="nav.home">Home</a>
      <a href="works.html" class="nav__link" data-i18n="nav.portfolio">Portfolio</a>
      <a href="shop.html" class="nav__link" data-i18n="nav.shop">Shop</a>
      <a href="order-workspace.html" class="nav__link" data-i18n="nav.orders">Orders</a>
      <a href="seller.html" class="nav__link" data-i18n="nav.studio">Studio</a>
    </nav>
    <div class="header__actions">
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" id="langBtn" aria-label="Language" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-lang-current>EN</span>
          <svg class="lang__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang__menu" id="langMenu"></div>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="order-gate" id="promoGate" style="display:none">
  <div class="order-gate__content">
    <h2 class="order-gate__title" data-promo="gate">Sign in to view your referral program</h2>
    <button class="btn btn--gold btn--lg" id="promoGateLogin" data-promo="gate.cta">Sign in</button>
  </div>
</div>

<section class="section seller-page" id="promoRoot" style="display:none">
  <div class="container" id="promoBody"></div>
</section>

<div class="modal" id="loginModal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
    <div class="modal__brand">duxury</div>
    <h3 class="modal__title" data-i18n="login.title">Sign in to continue</h3>
    <p class="modal__sub" data-promo="gate">Sign in to view your referral program</p>
    <button class="login-google" id="googleLogin">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Continue with Google</span>
    </button>
    <div class="modal__divider"><span data-i18n="login.or">or</span></div>
    <div class="login-email">
      <input type="email" id="emailInput" placeholder="you@example.com" data-i18n-placeholder="login.email.ph">
      <div class="login-code">
        <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification code" data-i18n-placeholder="login.code.ph">
        <button type="button" class="login-code__send" id="emailContinue" data-i18n="login.send">获取验证码</button>
      </div>
      <p class="login-email__hint" id="emailCodeHint" style="display:none"></p>
      <button type="button" class="btn btn--gold" id="codeConfirm" data-i18n="login.submit">登录</button>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=20261027b"></script>
<script src="js/api.js?v=20261026d"></script>
<script src="js/main.js?v=20261027b"></script>
<script src="js/promo.js?v=20261019r"></script>
</body>
</html>
