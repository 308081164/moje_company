<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duxury &middot; Refer &amp; Earn</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261102promo">
  <style>
    /* 个人推广页（scoped）— 与 Studio 推广赚佣对齐 */
    #promoBody { max-width: 980px; }
    .pm-page-head { margin: 8px 0 22px; max-width: 40em; }
    .pm-page-head__eyebrow { margin: 0 0 8px; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: #a68545; }
    .pm-page-head__title { margin: 0 0 8px; font-family: var(--font-serif); font-size: clamp(1.7rem, 2.6vw, 2.2rem); color: #1f1a14; line-height: 1.15; }
    .pm-page-head__sub { margin: 0; color: #6d655b; line-height: 1.65; font-size: 0.95rem; }
    .pm-share { display: grid; grid-template-columns: minmax(200px, 240px) minmax(0, 1fr); gap: 20px; margin: 0 0 22px; align-items: stretch; }
    .pm-qr { background: #fff; border: 1px solid rgba(201, 169, 110, 0.28); border-radius: 18px; padding: 16px; text-align: center; box-shadow: 0 10px 28px rgba(70, 48, 18, 0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pm-qr img { width: 100%; max-width: 208px; aspect-ratio: 1; display: block; border-radius: 8px; }
    .pm-qr__tip { margin-top: 12px; font-size: 0.75rem; letter-spacing: 0.06em; color: #8a8072; }
    .pm-card { background: linear-gradient(145deg, #17140f 0%, #2a2319 55%, #1a1611 100%); color: #f3e9d2; border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 36px rgba(40, 28, 12, 0.18); min-height: 100%; }
    .pm-card__brand { font-family: var(--font-serif); font-size: 0.95rem; letter-spacing: 0.32em; text-transform: uppercase; color: #c9a85c; }
    .pm-card__label { font-size: 0.78rem; letter-spacing: 0.08em; color: rgba(243, 233, 210, 0.62); margin-bottom: 4px; }
    .pm-card__code { font-family: var(--font-serif); font-size: clamp(1.8rem, 3vw, 2.45rem); letter-spacing: 0.2em; color: #e9cf8f; line-height: 1.1; word-break: break-all; }
    .pm-card__rate { display: inline-flex; align-self: flex-start; padding: 5px 12px; border-radius: 999px; font-size: 0.8rem; letter-spacing: 0.04em; color: #1a1814; background: linear-gradient(180deg, #e4c47a, #c9a85c); font-weight: 600; }
    .pm-card__row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .pm-btn { padding: 10px 18px; border-radius: 999px; font-size: 0.84rem; cursor: pointer; border: 1px solid rgba(201, 168, 92, 0.55); background: transparent; color: #e9cf8f; transition: background 0.15s, transform 0.15s; }
    .pm-btn:hover { background: rgba(201, 168, 92, 0.14); transform: translateY(-1px); }
    .pm-btn--gold { background: linear-gradient(180deg, #d4b36a, #c9a85c); border-color: #c9a85c; color: #1a1814; font-weight: 600; }
    .pm-btn--gold:hover { filter: brightness(1.05); }
    .pm-link { word-break: break-all; font-size: 0.78rem; line-height: 1.5; color: rgba(243, 233, 210, 0.55); padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(201, 168, 92, 0.18); }
    .pm-poster { margin: 0 0 28px; }
    .pm-poster__frame { max-width: 360px; border: 1px solid rgba(201, 169, 110, 0.28); border-radius: 18px; overflow: hidden; background: #14110d; }
    .pm-poster__frame canvas { width: 100%; display: block; }
    .pm-stats, .seller-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 18px; }
    .pm-stat, .seller-kpi {
      background: #fff;
      border: 1px solid rgba(201, 169, 110, 0.28);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 22px rgba(70, 48, 18, 0.05);
    }
    .pm-stat span, .seller-kpi span {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a7165;
    }
    .pm-stat strong, .seller-kpi strong {
      display: block;
      margin-top: 8px;
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 600;
      color: #1f1a14;
      letter-spacing: 0.02em;
    }
    .pm-stat--accent strong { color: #9a7428; }
    .pm-cashout {
      display: flex; gap: 12px; align-items: stretch; max-width: 520px; margin: 0 0 12px;
      padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(201, 169, 110, 0.22);
    }
    .pm-cashout input {
      flex: 1; min-width: 0; background: #fff; border: 1.5px solid rgba(184, 134, 11, 0.35);
      color: #1f1a14; border-radius: 10px; padding: 0 14px; min-height: 46px; font-size: 0.95rem;
    }
    .pm-cashout input::placeholder { color: #9a9084; }
    .pm-cashout .btn, .pm-cashout .sl-btn { flex: none; min-width: 88px; border-radius: 10px; }
    .pm-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; letter-spacing: 0.04em; }
    .pm-badge--pending { background: rgba(217, 119, 6, 0.14); color: #b45309; }
    .pm-badge--settled { background: rgba(46, 125, 78, 0.14); color: #2e7d4e; }
    .pm-badge--cancelled { background: rgba(107, 114, 128, 0.16); color: #6b7280; }
    .pm-amount--in { color: #8a6a22; font-weight: 600; font-family: var(--font-serif); }
    .pm-amount--out { color: #b45309; font-weight: 600; }
    .seller-h { margin: 28px 0 12px; font-family: var(--font-serif); font-size: 1.25rem; color: #1f1a14; }
    @media (max-width: 760px) {
      .pm-share, .pm-stats, .seller-kpis { grid-template-columns: 1fr; }
      .pm-cashout { flex-direction: column; max-width: none; }
    }
  </style>
</head>
<body class="storefront-page">

<header class="header scrolled" id="header">
  <div class="header__inner">
    <a href="index.html" class="brand"><span class="brand__name">duxury</span></a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link" data-i18n="nav.home">Home</a>
      <a href="shop.html" class="nav__link" data-i18n="nav.shop">Shop</a>
      <a href="order-workspace.html" class="nav__link" data-i18n="nav.orders">Orders</a>
      <a href="seller.html" class="nav__link" data-i18n="nav.studio">Studio</a>
    </nav>
    <div class="header__actions">
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" id="langBtn" aria-label="Language" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-lang-current>EN</span>
          <svg class="lang__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang__menu" id="langMenu"></div>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="order-gate" id="promoGate" style="display:none">
  <div class="order-gate__content">
    <h2 class="order-gate__title" data-promo="gate">Sign in to view your referral program</h2>
    <button class="btn btn--gold btn--lg" id="promoGateLogin" data-promo="gate.cta">Sign in</button>
  </div>
</div>

<section class="section seller-page" id="promoRoot" style="display:none">
  <div class="container" id="promoBody"></div>
</section>

<div class="modal" id="loginModal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" data-modal-close aria-label="Close">&times;</button>
    <div class="modal__brand">duxury</div>
    <h3 class="modal__title" data-i18n="login.title">Sign in to continue</h3>
    <p class="modal__sub" data-promo="gate">Sign in to view your referral program</p>
    <button class="login-google" id="googleLogin">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Continue with Google</span>
    </button>
    <div class="modal__divider"><span data-i18n="login.or">or</span></div>
    <div class="login-email">
      <input type="email" id="emailInput" placeholder="you@example.com" data-i18n-placeholder="login.email.ph">
      <div class="login-code">
        <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification code" data-i18n-placeholder="login.code.ph">
        <button type="button" class="login-code__send" id="emailContinue" data-i18n="login.send">获取验证码</button>
      </div>
      <p class="login-email__hint" id="emailCodeHint" style="display:none"></p>
      <button type="button" class="btn btn--gold" id="codeConfirm" data-i18n="login.submit">登录</button>
    </div>
  </div>
</div>
