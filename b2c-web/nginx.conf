# =============================================
# duxury 海外 C 端独立站 - Nginx 配置
# 静态站点 + 反代后端 API（含 WebSocket 聊天推送）
# =============================================

server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types text/html text/css application/javascript text/javascript application/json;

    # 允许管理端（所见即所得预览）通过 iframe 嵌入首页；frame-ancestors * 放开嵌入来源
    add_header Content-Security-Policy "frame-ancestors *" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/xml application/font-woff2 font/woff font/woff2 image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 站内聊天 WebSocket 推送（握手在 /api/ws/**）
    location /api/ws/ {
        proxy_pass http://backend:8851;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 后端 REST API 反代
    location /api/ {
        proxy_pass http://backend:8851;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 静态页面（多页站点：index.html / order-workspace.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，保证前端迭代即时生效
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 聊天脚本不带 hash，避免客户端一小时内还在跑没有心跳的旧 main.js
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 图片字体短缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
