<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珠宝定制管理系统</title>
    <link rel="icon" href="assets/icon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            overflow: hidden;
        }
        
        #root {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .app-title-bar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: #001529;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            user-select: none;
        }
        
        .app-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .app-title-icon {
            width: 16px;
            height: 16px;
        }
        
        .window-controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        
        .window-control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .window-control:hover {
            opacity: 0.8;
        }
        
        .window-control-close {
            background-color: #ff5f57;
        }
        
        .window-control-minimize {
            background-color: #ffbd2e;
        }
        
        .window-control-maximize {
            background-color: #28ca42;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- 应用标题栏（仅在macOS上显示） -->
        <div class="app-title-bar" id="titleBar" style="display: none;">
            <div class="app-title">
                <img src="assets/icon.png" alt="图标" class="app-title-icon">
                <span>珠宝定制管理系统</span>
            </div>
            <div class="window-controls">
                <div class="window-control window-control-close" id="closeBtn"></div>
                <div class="window-control window-control-minimize" id="minimizeBtn"></div>
                <div class="window-control window-control-maximize" id="maximizeBtn"></div>
            </div>
        </div>
        
        <!-- 加载界面 -->
        <div class="loading-container" id="loadingScreen">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载珠宝定制管理系统...</div>
            <div class="loading-subtext">请稍候</div>
        </div>
        
        <!-- React应用容器 -->
        <div id="app" style="display: none; flex: 1;"></div>
    </div>
    
    <script>
        // 显示自定义标题栏（仅在macOS上）
        if (navigator.platform.includes('Mac')) {
            document.getElementById('titleBar').style.display = 'flex';
            
            // 窗口控制按钮事件
            document.getElementById('closeBtn').addEventListener('click', () => {
                if (window.electronAPI) {
                    window.electronAPI.closeWindow();
                }
            });
            
            document.getElementById('minimizeBtn').addEventListener('click', () => {
                if (window.electronAPI) {
                    window.electronAPI.minimizeWindow();
                }
            });
            
            document.getElementById('maximizeBtn').addEventListener('click', () => {
                if (window.electronAPI) {
                    window.electronAPI.maximizeWindow();
                }
            });
        }
        
        // 应用加载完成后的处理
        window.addEventListener('app-loaded', () => {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        });
        
        // 错误处理
        window.addEventListener('error', (event) => {
            console.error('应用加载错误:', event.error);
            document.getElementById('loadingScreen').innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 24px; margin-bottom: 20px;">😢</div>
                    <div class="loading-text">应用加载失败</div>
                    <div class="loading-subtext" style="margin-top: 10px;">${event.error?.message || '未知错误'}</div>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 8px 16px; background: white; color: #667eea; border: none; border-radius: 4px; cursor: pointer;">
                        重新加载
                    </button>
                </div>
            `;
        });
    </script>
</body>
</html>
